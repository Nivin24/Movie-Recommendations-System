<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎬 Movie Recommendation System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
.perspective {
  perspective: 1000px;
}
.backface-hidden {
  backface-visibility: hidden;
}
.rotate-y-180 {
  transform: rotateY(180deg);
}
.transform-style-preserve-3d {
  transform-style: preserve-3d;
}
.group-hover\:rotate-y-180:hover {
  transform: rotateY(180deg);
}
</style>
</head>
<body class="bg-gradient-to-b from-[#e2bdff] to-[#160030] min-h-screen flex flex-col items-center p-6">

  <h1 class="text-4xl font-extrabold mb-8 text-center text-gray-900 drop-shadow-md">🎥 Movie Recommendation System</h1>

  <!-- Input Section -->
  <div class="w-full max-w-md flex items-center bg-white shadow-lg rounded-full p-1 border border-gray-200">
  <div class="relative flex-1">
    <span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400">
      <!-- Search Icon SVG -->
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z" />
      </svg>
    </span>
    <input type="text" id="movieInput" placeholder="Search for a movie..."
      class="w-full pl-10 pr-4 py-3 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-1 text-gray-700 placeholder-gray-400 transition duration-300">
  </div>
  <button id="recommendBtn"
    class="ml-3 bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-full font-semibold shadow-md hover:shadow-lg transition duration-300 transform hover:-translate-y-1">Search</button>
</div>

  <!-- Spinner -->
  <div id="loading" class="hidden mt-6 flex flex-col items-center">
    <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
    <p class="text-gray-600 mt-2">Fetching recommendations...</p>
  </div>

  <!-- Results -->
  <div id="results" class="mt-8 w-full max-w-6xl grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6"></div>

  <script src="script.js"></script>
</body>
</html>
